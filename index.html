
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff6f7">
<title>DLR Photo Editor</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:24px 16px 40px;
  background:#fff7f7;
  color:#634d53;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{max-width:520px;margin:auto}

header{text-align:center;margin:10px 0 25px}

.logo{
  color:#d58c9d;
  font-family:Georgia,serif;
  font-size:50px;
  letter-spacing:8px;
  margin:0;
}

.subtitle{
  color:#b78b95;
  font-size:10px;
  letter-spacing:4px;
  margin-top:5px;
}

.intro{
  text-align:center;
  font-size:13px;
  color:#a78b92;
  margin-bottom:20px;
}

.upload{
  display:block;
  position:relative;
  overflow:hidden;
  width:100%;
  padding:16px;
  text-align:center;
  background:#e8b6c2;
  color:white;
  border-radius:15px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.upload input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

.stage{
  position:relative;
  width:100%;
  height:350px;
  margin:18px 0;
  overflow:hidden;
  border-radius:18px;
  background:#f3e7e9;
  display:flex;
  align-items:center;
  justify-content:center;
}

.stage img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
}

#filtered{opacity:0}

#grain{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  display:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
  mix-blend-mode:soft-light;
}

.placeholder{
  color:#b99ba2;
  font-size:13px;
  text-align:center;
  padding:20px;
}

.section-title{
  font-size:12px;
  font-weight:700;
  color:#a17a85;
  letter-spacing:1.5px;
  margin:22px 0 12px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.filter{
  border:1px solid #efd9de;
  background:#fffdfd;
  color:#99727d;
  border-radius:12px;
  padding:14px 7px;
  font-size:12px;
  min-height:48px;
  cursor:pointer;
}

.filter.active{
  background:#d991a3;
  color:white;
  border-color:#d991a3;
}

.range-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  color:#99727d;
  margin:20px 0 8px;
}

input[type=range]{
  width:100%;
  accent-color:#d58c9d;
}

.save{
  display:block;
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:#d58c9d;
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.save:disabled{opacity:.45}

.note{
  text-align:center;
  color:#b49da3;
  font-size:11px;
  line-height:1.6;
  margin-top:14px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1 class="logo">DLR</h1>
  <div class="subtitle">PHOTO EDITOR</div>
</header>

<div class="intro">Fotoğraflarına kendi tarzını kat. ♡</div>

<label class="upload">
  Fotoğrafını seç
  <input type="file" id="photoInput" accept="image/*">
</label>

<div class="stage">
  <div class="placeholder" id="placeholder">
    Fotoğrafın burada görünecek ♡
  </div>
  <img id="original" alt="Fotoğrafın">
  <img id="filtered" alt="Filtreli fotoğraf">
  <div id="grain"></div>
</div>

<div class="section-title">DLR FİLTRELERİ ♡</div>
<div class="filters" id="filters"></div>

<div class="range-row">
  <span>Filtre yoğunluğu</span>
  <strong id="intensityValue">100%</strong>
</div>

<input type="range" id="intensity" min="0" max="100" value="100">

<button class="save" id="saveButton" disabled>
  Fotoğrafı kaydet ♡
</button>

<div class="note">
  DLR ile anılarını kendi tarzında düzenle.
</div>

</div>

<script>
const filterList = [
  {name:"Original", css:"none", grain:0},
  {name:"Digital Camera", css:"brightness(1.12) contrast(1.32) saturate(1.38) sepia(0.08)", grain:0.30},
  {name:"Vintage", css:"sepia(0.38) saturate(0.92) contrast(1.14) brightness(1.04)", grain:0.28},
  {name:"Retro Flash", css:"brightness(1.20) contrast(1.38) saturate(1.22)", grain:0.20},
  {name:"Classic B&W", css:"grayscale(1) contrast(1.48) brightness(1.03)", grain:0.25},
  {name:"Soft Mono", css:"grayscale(1) contrast(1.10) brightness(1.10)", grain:0.14},
  {name:"Cool CCD", css:"saturate(1.25) contrast(1.24) hue-rotate(12deg) brightness(1.04)", grain:0.16},
  {name:"Warm 2000s", css:"sepia(0.22) saturate(1.48) contrast(1.18) brightness(1.05)", grain:0.23},
  {name:"Fade Film", css:"contrast(0.84) brightness(1.13) saturate(0.82) sepia(0.17)", grain:0.24},
  {name:"Night Flash", css:"brightness(1.15) contrast(1.48) saturate(1.18)", grain:0.22}
];

const photoInput = document.getElementById("photoInput");
const original = document.getElementById("original");
const filtered = document.getElementById("filtered");
const placeholder = document.getElementById("placeholder");
const grainLayer = document.getElementById("grain");
const intensity = document.getElementById("intensity");
const intensityValue = document.getElementById("intensityValue");
const filters = document.getElementById("filters");
const saveButton = document.getElementById("saveButton");

let selectedFilter = 0;
let photoReady = false;

filterList.forEach((filter,index)=>{
  const button = document.createElement("button");
  button.className = "filter" + (index === 0 ? " active" : "");
  button.textContent = filter.name;
  button.type = "button";

  button.addEventListener("click",()=>{
    selectedFilter = index;

    document.querySelectorAll(".filter").forEach(item=>{
      item.classList.remove("active");
    });

    button.classList.add("active");
    updatePreview();
  });

  filters.appendChild(button);
});

photoInput.addEventListener("change",event=>{
  const file = event.target.files && event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Lütfen bir fotoğraf seç.");
    return;
  }

  const reader = new FileReader();

  reader.onload = event=>{
    original.onload = ()=>{
      filtered.src = original.src;

      photoReady = true;
      original.style.display = "block";
      filtered.style.display = "block";
      placeholder.style.display = "none";

      saveButton.disabled = false;
      updatePreview();
    };

    original.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

function updatePreview(){
  if(!photoReady) return;

  const filter = filterList[selectedFilter];
  const amount = Number(intensity.value) / 100;

  filtered.style.filter = filter.css;
  filtered.style.opacity = amount;

  grainLayer.style.display = filter.grain > 0 ? "block" : "none";
  grainLayer.style.opacity = String(filter.grain * amount);

  intensityValue.textContent = intensity.value + "%";
}

intensity.addEventListener("input",updatePreview);

function addGrain(ctx,width,height,amount){
  if(amount <= 0) return;

  const tile = document.createElement("canvas");
  tile.width = 160;
  tile.height = 160;

  const tileCtx = tile.getContext("2d");
  const pixels = tileCtx.createImageData(160,160);

  for(let i=0;i<pixels.data.length;i+=4){
    const value = Math.floor(Math.random()*255);
    pixels.data[i] = value;
    pixels.data[i+1] = value;
    pixels.data[i+2] = value;
    pixels.data[i+3] = 65;
  }

  tileCtx.putImageData(pixels,0,0);

  const pattern = ctx.createPattern(tile,"repeat");

  ctx.save();
  ctx.globalAlpha = amount;
  ctx.globalCompositeOperation = "soft-light";
  ctx.fillStyle = pattern;
  ctx.fillRect(0,0,width,height);
  ctx.restore();
}

saveButton.addEventListener("click",()=>{
  if(!photoReady) return;

  saveButton.disabled = true;
  saveButton.textContent = "Hazırlanıyor...";

  try{
    const maxSide = 2400;
    const scale = Math.min(
      1,
      maxSide / Math.max(original.naturalWidth,original.naturalHeight)
    );

    const width = Math.round(original.naturalWidth*scale);
    const height = Math.round(original.naturalHeight*scale);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(original,0,0,width,height);

    const amount = Number(intensity.value)/100;
    const filter = filterList[selectedFilter];

    if(filter.css !== "none" && amount > 0){
      ctx.save();
      ctx.globalAlpha = amount;
      ctx.filter = filter.css;
      ctx.drawImage(original,0,0,width,height);
      ctx.restore();
    }

    addGrain(ctx,width,height,filter.grain*amount);

    const imageUrl = canvas.toDataURL("image/jpeg",0.94);
    const link = document.createElement("a");

    link.href = imageUrl;
    link.download = "DLR-photo.jpg";

    document.body.appendChild(link);
    link.click();
    link.remove();

  }catch(error){
    alert("Fotoğraf kaydedilemedi. Lütfen tekrar dene.");
  }

  saveButton.textContent = "Fotoğrafı kaydet ♡";
  saveButton.disabled = false;
});
</script>
</body>
</html>
